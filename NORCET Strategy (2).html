/* Layout: native-app shell. Fixed top bar, fixed bottom tab bar, scrolling content between. Dark-first, ring charts, gradient hero. */
:root{
  --bg:#0a0a0c; --surface:#141418; --surface2:#1d1d23; --fg:#f1f2f6; --mute:#8d909c; --line:#26262d;
  --accent:#6c8cff; --accent-fg:#0a0f1f; --g1:#2f6df6; --g2:#7a3df0;
  --chn:#6ea8ff; --ped:#3ddc97; --psy:#c58bff; --fon:#2dd4bf; --obg:#ff7eb6; --msn:#ffa94d; --pha:#bef264; --oti:#ff7a7a; --nut:#ffd166; --rsm:#a5b4fc; --for:#94a3b8; --soc:#e879f9;
  --ok:#3ddc97; --okbg:#10302a; --warn:#ffb454; --warnbg:#3a2a10; --bad:#ff7b7b; --badbg:#3d1a1d;
  --font:'InterEmb','Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --head:'Space Grotesk','InterEmb','Inter',system-ui,sans-serif;
  --glass:rgba(20,20,24,.62); --glass2:rgba(255,255,255,.07); --gline:rgba(255,255,255,.08); --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f2f4fb; --surface:#ffffff; --surface2:#e8ecf8; --fg:#10182d; --mute:#5a6685; --line:#d6dcef;
  --accent:#3257e0; --accent-fg:#ffffff; --chn:#1f5fa8; --ped:#16804a; --psy:#8a3fa0; --fon:#0f766e; --obg:#be185d; --msn:#c2570c; --pha:#4d7c0f; --oti:#b91c1c; --nut:#a16207; --rsm:#4338ca; --for:#475569; --soc:#a21caf;
  --ok:#12804a; --okbg:#ddf3e8; --warn:#9a5600; --warnbg:#ffefd3; --bad:#c0332b; --badbg:#fde6e3; --glass:rgba(255,255,255,.62); --glass2:rgba(214,223,247,.5); --gline:rgba(255,255,255,.85); --shadow:0 10px 28px rgba(40,60,120,.16); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f4fb; --surface:#ffffff; --surface2:#e8ecf8; --fg:#10182d; --mute:#5a6685; --line:#d6dcef;
  --accent:#3257e0; --accent-fg:#ffffff; --chn:#1f5fa8; --ped:#16804a; --psy:#8a3fa0; --fon:#0f766e; --obg:#be185d; --msn:#c2570c; --pha:#4d7c0f; --oti:#b91c1c; --nut:#a16207; --rsm:#4338ca; --for:#475569; --soc:#a21caf;
  --ok:#12804a; --okbg:#ddf3e8; --warn:#9a5600; --warnbg:#ffefd3; --bad:#c0332b; --badbg:#fde6e3; --glass:rgba(255,255,255,.62); --glass2:rgba(214,223,247,.5); --gline:rgba(255,255,255,.85); --shadow:0 10px 28px rgba(40,60,120,.16); color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
button,label,.row,a{touch-action:manipulation}
body{-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;
  padding-block:calc(60px) 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  user-select:none;-webkit-user-select:none;overscroll-behavior-y:contain}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--head);margin:0}
button{font:inherit;color:inherit}

/* app bar + tab bar */
.bar{position:fixed;left:0;right:0;top:0;z-index:20;background:var(--bg);padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.bar>div{max-width:560px;margin:0 auto;height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand svg{width:32px;height:32px;flex:none}
.brand b{font-family:var(--head);font-size:18px;letter-spacing:.01em;white-space:nowrap}
.brand b em{font-style:normal;color:var(--accent)}
.chip{font-size:12px;font-weight:600;padding:6px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{color:var(--accent)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(16px,env(safe-area-inset-left,0px))}
.nav>div{pointer-events:auto;width:100%;max-width:380px;margin:0 auto;display:flex;justify-content:space-between;gap:2px;padding:4px;border-radius:99px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border:1px solid var(--gline);box-shadow:var(--shadow)}
.nav button{background:none;border:0;display:flex;align-items:center;justify-content:center;gap:0;padding:0;flex:1 1 0;height:38px;color:var(--mute);font-size:12.5px;font-weight:600;cursor:pointer;border-radius:99px;transition:background .25s,color .25s,flex-grow .25s,gap .25s}
.nav button span{max-width:0;overflow:hidden;white-space:nowrap;opacity:0;transition:max-width .25s,opacity .2s}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,transparent);flex-grow:2.3;gap:6px}
.nav button[aria-selected="true"] span{max-width:90px;opacity:1}
.nav button[aria-selected="true"] svg{stroke-width:2.4}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* hero */
.hero{border-radius:24px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));position:relative;overflow:hidden;margin-bottom:12px}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero .top{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.hero .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.hero .big{font-family:var(--head);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.hero .big small{font-size:15px;font-weight:500;opacity:.85;margin-left:5px}
.hero .sub2{font-size:14px;margin-top:4px;opacity:.95;font-variant-numeric:tabular-nums}
.hero .speed{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;align-items:center;font-size:12px;position:relative;z-index:1}
.hero .speed button{padding:4px 11px;border-radius:99px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.hero .speed button[aria-pressed="true"]{background:#fff;color:#2a3bd0;border-color:#fff;font-weight:600}
.ring text{font-family:var(--head);font-weight:700}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;min-width:0}
.tile b{font-size:12px}
.tile .n{font-family:var(--head);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}

document.addEventListener('click',e=>{
  const T=e.target;
  const pl=T.closest('[data-play]'); if(pl){ e.preventDefault(); startTimer(pl.dataset.play); return; }
  const nt=T.closest('[data-note]'); if(nt){ e.preventDefault(); noteSheet(nt.dataset.note); return; }
  if(T.closest('#themebtn')){ themeSheet(); return; }
  if(T.id==='shbtn'){ shareSheet(); return; }
  if(T.id==='sheet'){ closeSheet(); return; }
  if(T.closest('#mini')){ openFocus(); return; }
  const md=T.closest('[data-mode]'); if(md){ themeMode=md.dataset.mode; try{localStorage.setItem('ct_mode',themeMode)}catch(_){} applyTheme(); themeSheet(); return; }
  const ac=T.closest('[data-acc]'); if(ac){ accentKey=ac.dataset.acc; try{localStorage.setItem('ct_acc',accentKey)}catch(_){} applyTheme(); themeSheet(); render(); return; }
  const a=T.closest('[data-act]'); if(!a) return; const act=a.dataset.act, id=a.dataset.id2;
  if(act==='close') closeSheet();
  else if(act==='n-save'){ const txt=document.getElementById('n-text').value.trim(), dbt=document.getElementById('n-doubt').checked; if(!txt&&!dbt) delete notes[id]; else notes[id]={text:txt,doubt:dbt,ts:Date.now()}; persistNote(id); closeSheet(); render(); }
  else if(act==='n-del'){ delete notes[id]; persistNote(id); closeSheet(); render(); }
  else if(act==='n-play'){ closeSheet(); startTimer(id); }
  else if(act==='f-min') minimizeFocus();
  else if(act==='f-pause'){ if(tm.start){ tm.acc+=Date.now()-tm.start; tm.start=null; lockWake(false); } else { tm.start=Date.now(); tmLive=true; lockWake(true); } saveTimer(); document.getElementById('focus').dataset.id=''; drawFocus(); }
  else if(act==='f-done') finishTimer(true);
  else if(act==='f-stop'){ finishTimer(false); }
  else if(act==='sh-save') saveCard();
});

let qsetup={s:'Mixed',n:10}, qz=null;
function qSeen(){ try{ return JSON.parse(localStorage.getItem('ct_qseen')||'[]')||[]; }catch(e){ return []; } }
function qMarkSeen(ids){ try{ const a=[...new Set([...qSeen(),...ids])]; localStorage.setItem('ct_qseen',JSON.stringify(a)); }catch(e){} }
const qShuf=a=>{ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function quizCard(){
  const pool=QB.filter(x=>qsetup.s==='Mixed'||x[0]===qsetup.s).length, seen=new Set(qSeen());
  return `<h2>Practice quiz <span>${QB.length} sawal</span></h2><section class="card" style="padding:14px"><div class="chips">${QSUB.map(([k,l])=>`<button data-qs="${k}" aria-pressed="${qsetup.s===k}">${l}</button>`).join('')}</div><div class="chips">${[10,20,30].map(n=>`<button data-qn="${n}" aria-pressed="${qsetup.n===n}">${n} sawal</button>`).join('')}</div><div class="note">Har sawal ke baad jawab aur explanation dikhega. Result Test history me apne aap save hoga (negative marking upar ke setting se).</div><button class="btn" id="qstart">Quiz shuru karo (${Math.min(qsetup.n,pool)} sawal)</button></section>`;
}
function qStart(){
  const seen=new Set(qSeen()); let pool=QB.map((x,i)=>({x,i})).filter(o=>qsetup.s==='Mixed'||o.x[0]===qsetup.s);
  if(qWeakSet){ const wp=pool.filter(o=>qWeakSet.has(topicOf(o.x[1],o.x[0]))); if(wp.length) pool=wp; }
  const fresh=qShuf(pool.filter(o=>!seen.has(o.x[1]))), old=qShuf(pool.filter(o=>seen.has(o.x[1])));
  const pick=[...fresh,...old].slice(0,Math.min(qsetup.n,pool.length));
  qz={subj:qsetup.s,list:pick.map(o=>({s:o.x[0],q:o.x[1],opts:qShuf([o.x[2],o.x[3],o.x[4],o.x[5]]),ok:o.x[2],e:o.x[6],pick:null})),i:0};
  qDraw();
}
function qDraw(){
  const q=qz.list[qz.i], n=qz.list.length, ans=q.pick!==null;
  const sc=qz.list.slice(0,qz.i+(ans?1:0)).filter(x=>x.pick===x.ok).length;
  openSheet(`<div style="display:flex;justify-content:space-between;align-items:center"><b style="color:var(${SUBVAR[q.s]||'--accent'})">${QNAME(q.s)}</b><span class="pill">Sawal ${qz.i+1} / ${n}</span></div><div class="qbar"><i style="transform:scaleX(${(qz.i+(ans?1:0))/n})"></i></div><div style="font-size:16.5px;font-weight:650;line-height:1.4;font-family:var(--head)">${q.q}</div>${q.opts.map((o,k)=>`<button class="qopt ${ans?(o===q.ok?'ok':(q.pick===o?'bad':'')):''}" data-qo="${k}" ${ans?'disabled':''}>${o}</button>`).join('')}${ans?`<div class="qexp"><b>${q.pick===q.ok?'Sahi!':'Sahi jawab: '+q.ok}</b><br>${q.e}</div>`:''}<div class="qrow">${ans?'':`<button class="btn qghost" id="qskip">Skip</button>`}<button class="btn" id="qnext" ${ans?'':'hidden'}>${qz.i===n-1?'Result dekho':'Agla sawal'}</button></div><button class="qlink" id="qquit">Quiz chhodo</button>`);
}
function qAnswer(k){
  const q=qz.list[qz.i]; if(q.pick!==null) return; q.pick=q.opts[k]; topicUpd(q.q,q.s,q.pick===q.ok);
  try{ navigator.vibrate&&navigator.vibrate(q.pick===q.ok?10:[15,30,15]); }catch(e){}
  qDraw();
}
function qNext(){ if(qz.i<qz.list.length-1){ qz.i++; qDraw(); } else qFinish(); }
function qFinish(){
  const L=qz.list, neg=parseFloat(tform.neg), c=L.filter(x=>x.pick===x.ok).length, w=L.filter(x=>x.pick!==null&&x.pick!==x.ok).length, sk=L.length-c-w;
  qMarkSeen(L.filter(x=>x.pick!==null).map(x=>x.q));
  const sub=ALLS.includes(qz.subj)?qz.subj:'Full test';
  const t={id:'t'+Date.now(),ts:Date.now(),date:today(),subj:sub,q:L.length,c,w,neg};
  tests.push(t);
  if(mode==='db'&&tcol) tcol.doc(t.id).set(t).catch(()=>{}); else saveTests();
  const score=c-w*neg, pct=score/L.length*100, wrong=L.filter(x=>x.pick!==x.ok);
  openSheet(`<h3>Quiz complete</h3><div class="sub">Test history me save ho gaya.</div><div class="tip" style="justify-content:space-between;align-items:center"><div><b style="font-size:26px;font-family:var(--head)">${score.toFixed(2)}</b> <span style="color:var(--mute)">/ ${L.length} · ${pct.toFixed(0)}%</span></div><div style="text-align:right;color:var(--mute);font-size:13px">Sahi ${c} · Galat ${w}<br>Skip ${sk}</div></div>${wrong.length?`<h2 style="margin-top:14px">Review <span>${wrong.length} sawal</span></h2>${wrong.map(x=>`<div class="qexp" style="margin-top:8px"><b>${x.q}</b><br>Aapka jawab: ${x.pick===null?'Skip':x.pick}<br>Sahi: <b style="color:var(--ok)">${x.ok}</b><br><span style="color:var(--mute)">${x.e}</span></div>`).join('')}`:'<div class="note" style="margin-top:10px">Sab sahi! Shabaash.</div>'}<button class="btn" data-act="close" id="qclose">Band karo</button>`);
  if(pct>=70) showToast('Badhiya score!',true);
  qz=null; render();
}
document.addEventListener('click',e=>{
  const T=e.target;
  const a=T.closest('[data-qs]'); if(a){ qsetup.s=a.dataset.qs; render(); return; }
  const b=T.closest('[data-qn]'); if(b){ qsetup.n=parseInt(b.dataset.qn); render(); return; }
  if(T.id==='qstart'){ qStart(); return; }
  const o=T.closest('[data-qo]'); if(o&&qz){ qAnswer(parseInt(o.dataset.qo)); return; }
  if(T.id==='qnext'&&qz){ qNext(); return; }
  if(T.id==='qskip'&&qz){ qNext(); return; }
  if(T.id==='qquit'){ e.preventDefault(); if(qz&&qz.list.some(x=>x.pick!==null)){ qz.i=qz.list.length-1; qz.list.forEach((x,k)=>{}); qFinish(); } else { qz=null; closeSheet(); } return; }
});

function npShrink(file){ return new Promise((ok,no)=>{ const u=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{ let w=im.naturalWidth,h=im.naturalHeight, m=1100, k=Math.min(1,m/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(im,0,0,w,h); URL.revokeObjectURL(u);
    let q=.7, d=c.toDataURL('image/jpeg',q), cw=w, ch=h; while(d.length>115000){ if(q>.32){ q-=.06; } else { cw=Math.round(cw*.88); ch=Math.round(ch*.88); c.width=cw; c.height=ch; c.getContext('2d').drawImage(im,0,0,cw,ch); } d=c.toDataURL('image/jpeg',q); if(cw<500) break; } ok(d); };
  im.onerror=no; im.src=u; }); }

/* ---- show full subject name (Psychiatric) in all visible text; ids stay 'Psych' ---- */
(function(){
  const RX=/\bPsych\b/g, SKIP={TEXTAREA:1,SCRIPT:1,STYLE:1,INPUT:1};
  function fix(n){
    if(n.nodeType===3){ if(n.parentNode&&!SKIP[n.parentNode.nodeName]&&RX.test(n.nodeValue)){ RX.lastIndex=0; n.nodeValue=n.nodeValue.replace(RX,'Psychiatric'); } RX.lastIndex=0; return; }
    if(n.nodeType!==1||SKIP[n.nodeName]) return;
    const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT,{acceptNode:t=>(t.parentNode&&!SKIP[t.parentNode.nodeName])?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
    const L=[]; let t; while(t=w.nextNode()) L.push(t); L.forEach(fix);
    if(n.getAttribute){ ['aria-label','alt','title'].forEach(a=>{ const v=n.getAttribute(a); if(v&&/\bPsych\b/.test(v)) n.setAttribute(a,v.replace(/\bPsych\b/g,'Psychiatric')); }); }
  }
  const mo=new MutationObserver(ms=>{ mo.disconnect(); try{ ms.forEach(m=>{ if(m.type==='characterData') fix(m.target); else m.addedNodes.forEach(fix); }); }finally{ mo.observe(document.body,{childList:true,subtree:true,characterData:true}); } });
  mo.observe(document.body,{childList:true,subtree:true,characterData:true}); fix(document.body);
})();


/* ---- week strip ---- */
function weekStrip(t){
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const d0=new Date(t+'T00:00:00'), mon=new Date(d0); mon.setDate(d0.getDate()-((d0.getDay()+6)%7));
  const L='MTWTFSS'; let cells='';
  for(let i=0;i<7;i++){
    const d=new Date(mon); d.setDate(mon.getDate()+i); const k=iso(d), day=DAYS.find(x=>x.date===k);
    let p=0, st='off', tip='Chhutti';
    if(day){ const n=day.ids.filter(id=>done[id]).length; p=Math.round(n/day.ids.length*100); st=p>=100?'full':k===t?'today':k<t?'miss':'fut'; tip=`${n}/${day.ids.length} classes`; }
    else if(k===t) st='today';
    cells+=`<div class="wk ${st}" role="img" aria-label="${k}: ${tip}"><span>${L[i]}</span><i style="--p:${p}"><b>${d.getDate()}</b></i></div>`;
  }
  return `<section class="card wkc" aria-label="Is hafte ka progress">${cells}</section>`;
}

(function(){

    dy=Math.max(0,d); sh.style.transform=`translateY(${dy}px)`; ov.style.opacity=String(Math.max(.35,1-dy/500)); if(e.cancelable) e.preventDefault(); },{passive:false});

   ===================================================================== */
const jget=(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } };
const jset=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
const DAYMS=864e5, sod=t=>{ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };

/* ---------- 1. spaced revision ---------- */
const SRS_STEPS=[1,3,7,21];
function srsGet(){ return jget('ct_srs',{}); }
function revDue(){
  const s=srsGet(), now=sod(Date.now()), out=[];
  Object.keys(done).forEach(id=>{ const c=BYID[id]; if(!c) return; const n=(s[id]&&s[id].n)||0; if(n>=SRS_STEPS.length) return;
    const due=sod(done[id])+SRS_STEPS[n]*DAYMS; if(due<=now) out.push({id,c,n,late:Math.round((now-due)/DAYMS)}); });
  return out.sort((a,b)=>b.late-a.late||a.c.n-b.c.n);
}
function srsCard(){
  const L=revDue(); if(!L.length) return '';
  return `<div class="card rvc" data-rvopen="1" role="button" tabindex="0"><div class="n">${L.length}</div><div><b>Aaj revise karo</b><small>${L.slice(0,2).map(x=>x.c.s+' '+x.c.n).join(', ')}${L.length>2?' aur '+(L.length-2)+' aur':''}</small></div></div>`;
}
function revSheet(){
  const L=revDue();
  openSheet(`<h3>Revision list</h3><div class="sub">Class ke 1, 3, 7 aur 21 din baad dobara dekho. Yahi yaad rakhne ka sabse pakka tareeka hai.</div>${L.length?`<section class="card" style="padding:0">${L.map(x=>`<div class="rvi"><div class="m"><b style="color:var(${SUBVAR[x.c.s]})">${x.c.s} · Class ${x.c.n}</b><small>${SRS_STEPS[x.n]} din wali revision${x.late>0?' · '+x.late+' din late':''}</small></div><button data-rv="${x.id}">Ho gaya</button></div>`).join('')}</section>`:'<div class="note">Aaj koi revision baaki nahi. Shabaash!</div>'}<button class="btn" data-act="close">Band karo</button>`);
}
function revMark(id){ const s=srsGet(); const o=s[id]||{n:0,ts:[]}; o.n=(o.n||0)+1; (o.ts=o.ts||[]).push(Date.now()); s[id]=o; jset('ct_srs',s); showToast('Revision ho gayi',true); revSheet(); render(); }

const TOPIC_FB={CHN:'Community health (other)',Pedia:'Paediatrics (other)',Psych:'Psychiatric (other)',Gen:'General nursing (other)'};
function topicOf(q,s){ if(NEWSUB.some(x=>x.k===s)) return SNAME(s); const t=String(q).toLowerCase(); for(const [rx,n] of TOPIC_RULES) if(rx.test(t)) return n; return TOPIC_FB[s]||'General nursing (other)'; }
function topicUpd(q,s,ok){ const T=jget('ct_topic',{}); const n=topicOf(q,s); const a=T[n]||[0,0]; if(ok) a[0]++; else a[1]++; T[n]=a; jset('ct_topic',T); }
function weakList(){ const T=jget('ct_topic',{}); return Object.entries(T).map(([n,[c,w]])=>({n,c,w,t:c+w,acc:c/(c+w)})).filter(x=>x.t>=3).sort((a,b)=>a.acc-b.acc||b.t-a.t); }
let qWeakSet=null;
function weakCard(){
  const W=weakList().filter(x=>x.acc<0.8).slice(0,4);
  if(!W.length) return `<h2>Kamzor topics</h2><section class="card" style="padding:14px"><div class="note" style="margin:0">Quiz do. Jis topic me kam se kam 3 sawal ho jayenge, wo yahan dikhega aur app batayega kaunsa kamzor hai.</div></section>`;
  return `<h2>Kamzor topics <span>quiz ke hisaab se</span></h2><section class="card" style="padding:14px">${W.map(x=>`<div class="wkt"><div class="nm">${x.n}</div><div class="bar"><i style="transform:scaleX(${Math.max(.04,x.acc)})"></i></div><div class="pc">${Math.round(x.acc*100)}%</div></div>`).join('')}<button class="btn" id="qweak" style="margin-top:12px">In topics ka practice (10 sawal)</button></section>`;
}
function qStartWeak(){
  const W=new Set(weakList().filter(x=>x.acc<0.8).slice(0,3).map(x=>x.n)); if(!W.size) return;
  qWeakSet=W; const keep=qsetup.n; qsetup.n=10; qsetup.s='Mixed'; try{ qStart(); }finally{ qWeakSet=null; qsetup.n=keep; }

/* ---------- 3. backup / restore ---------- */
function backupCard(){
  return `<h2>Backup aur restore</h2><section class="card" style="padding:14px"><div class="note" style="margin:0">Poora data (ticks, notes, photos, tests, revision, quiz score) ek file me. Phone badalne ya data clear hone par wapas laa sakte ho.</div><div class="bkr"><button class="btn" id="bk-out">Backup download</button><button class="btn qghost" id="bk-in">Restore karo</button></div><input type="file" id="bk-file" accept=".json,application/json" hidden><div class="note" id="bk-msg" style="margin:8px 0 0"></div></section>`;
}
async function bkExport(){
  const local={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(/^ct_/.test(k)&&!['ct_done','ct_tests','ct_notes'].includes(k)) local[k]=localStorage.getItem(k); } }catch(e){}
  const data={v:1,app:'norcet-strategy',ts:Date.now(),done,tests,notes,local};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'}), name='norcet-backup-'+today()+'.json', msg=document.getElementById('bk-msg');
  try{ const d=await window.claude?.use?.('downloads'); if(d){ await d.save({filename:name,data:blob}); if(msg) msg.textContent='Backup ban gaya'; return; } }catch(e){ if(e&&e.code==='declined') return; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); if(msg) msg.textContent='Backup download ho gaya'; }catch(e){ if(msg) msg.textContent='Download nahi hua'; }
}
async function bkImport(file){
  const msg=document.getElementById('bk-msg'); const say=t=>{ if(msg) msg.textContent=t; };
  try{
    const d=JSON.parse(await file.text());
    if(!d||d.app!=='norcet-strategy'||typeof d.done!=='object') { say('Ye NORCET backup file nahi lagti'); return; }
    let nd=0,nt=0,nn=0;
    Object.entries(d.done||{}).forEach(([id,ts])=>{ if(BYID[id]&&!done[id]){ done[id]=ts; persist(id,true,ts); nd++; } });
    (d.tests||[]).forEach(t=>{ if(t&&t.id&&!tests.some(x=>x.id===t.id)){ tests.push(t); if(mode==='db'&&tcol) tcol.doc(t.id).set(t).catch(()=>{}); nt++; } });
    if(!(mode==='db'&&tcol)) saveTests();
    Object.entries(d.notes||{}).forEach(([id,x])=>{ if(BYID[id]&&x&&(!notes[id]||(x.ts||0)>(notes[id].ts||0))){ notes[id]=x; persistNote(id); nn++; } });
    Object.entries(d.local||{}).forEach(([k,v])=>{ try{ if(/^ct_/.test(k)&&localStorage.getItem(k)==null) localStorage.setItem(k,v); }catch(e){} });
    try{ const a=jget('ct_srs',{}), b=JSON.parse((d.local||{}).ct_srs||'{}'); Object.keys(b).forEach(id=>{ if(!a[id]||(b[id].n||0)>(a[id].n||0)) a[id]=b[id]; }); jset('ct_srs',a); }catch(e){}
    render(); say(`Restore ho gaya: ${nd} classes, ${nt} tests, ${nn} notes judi`); showToast('Restore ho gaya',true);
  }catch(e){ say('File padh nahi paaye'); }
}

/* ---------- 4. timed mock test ---------- */
let mockN=30, mk=null, mkI=null;
function mockCard(){
  return `<h2>Timed mock test <span>1 min / sawal</span></h2><section class="card" style="padding:14px"><div class="chips">${[30,50,100].map(n=>`<button data-mn="${n}" aria-pressed="${mockN===n}">${n} sawal</button>`).join('')}</div><div class="note">Mixed subjects, countdown timer, sawal mark kar sakte ho, jawab sirf end me dikhenge. Negative marking aapke setting ke hisaab se.</div><button class="btn" id="mk-start">Mock shuru karo</button></section>`;
}
function mockStart(){
  const list=qShuf(QB).slice(0,Math.min(mockN,QB.length)).map(x=>({s:x[0],q:x[1],opts:qShuf([x[2],x[3],x[4],x[5]]),ok:x[2],e:x[6],pick:null,mark:false}));
  mk={list,i:0,end:Date.now()+list.length*60000,t0:Date.now(),ask:false,pal:false,res:null};
  const el=document.createElement('div'); el.className='np'; el.id='mockp'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); document.body.appendChild(el);
  clearInterval(mkI); mkI=setInterval(mockTick,500); mockDraw();
}
function mockLeft(){ return Math.max(0,Math.round((mk.end-Date.now())/1000)); }
function mockTick(){ if(!mk||mk.res){ clearInterval(mkI); return; } const l=mockLeft(), t=document.getElementById('mk-t'); if(t){ t.textContent=String(Math.floor(l/60)).padStart(2,'0')+':'+String(l%60).padStart(2,'0'); t.classList.toggle('low',l<=60); } if(l<=0) mockFinish(); }
function mockDraw(){
  const el=document.getElementById('mockp'); if(!el||!mk) return;
  if(mk.res){ el.innerHTML=mockResultHTML(); return; }
  const q=mk.list[mk.i], n=mk.list.length, ans=mk.list.filter(x=>x.pick!==null).length, mkd=mk.list.filter(x=>x.mark).length;
  const l=mockLeft();
  let body;
  if(mk.ask) body=`<h1 style="margin:6px 0;font-family:var(--head)">Submit karna hai?</h1><div class="rpt"><div><b>${ans}</b><span>jawab diye</span></div><div><b>${n-ans}</b><span>chhode</span></div><div><b>${mkd}</b><span>marked</span></div></div><div class="note">Submit ke baad jawab badal nahi sakte.</div><button class="btn" id="mk-yes">Haan, submit karo</button><button class="btn qghost" id="mk-no" style="margin-top:8px">Wapas jao</button>`;
  else if(mk.pal) body=`<h2>Sawal list</h2><div class="pal">${mk.list.map((x,k)=>`<button data-mg="${k}" class="${x.pick!==null?'a':''} ${x.mark?'mk':''} ${k===mk.i?'cur':''}">${k+1}</button>`).join('')}</div><div class="note">Neela = jawab diya, peela ghera = mark kiya.</div><button class="btn" id="mk-back">Sawal par wapas</button>`;
  else body=`<div style="display:flex;justify-content:space-between;align-items:center"><b style="color:var(${SUBVAR[q.s]||'--accent'})">${QNAME(q.s)}</b><span class="pill">Sawal ${mk.i+1} / ${n}</span></div><div style="font-size:17px;font-weight:650;line-height:1.45;font-family:var(--head);margin:12px 0 4px">${q.q}</div>${q.opts.map((o,k)=>`<button class="qopt ${q.pick===o?'sel':''}" data-mo="${k}">${o}</button>`).join('')}<div class="qrow"><button class="btn qghost" id="mk-mark">${q.mark?'Mark hatao':'Mark for review'}</button><button class="btn qghost" id="mk-clr" ${q.pick===null?'disabled':''}>Jawab hatao</button></div><div class="qrow"><button class="btn qghost" id="mk-prev" ${mk.i===0?'disabled':''}>Pichhla</button><button class="btn qghost" id="mk-pal">List</button><button class="btn" id="mk-next" ${mk.i===n-1?'disabled':''}>Agla</button></div>`;
  el.innerHTML=`<div class="mk-top"><button id="mk-quit">Chhodo</button><span class="mk-t ${l<=60?'low':''}" id="mk-t">${String(Math.floor(l/60)).padStart(2,'0')}:${String(l%60).padStart(2,'0')}</span><button class="go" id="mk-sub">Submit</button></div><div class="np-body">${body}</div>`;
}
function mockFinish(){
  if(!mk||mk.res) return; clearInterval(mkI);
  const L=mk.list, neg=parseFloat(tform.neg), c=L.filter(x=>x.pick===x.ok).length, w=L.filter(x=>x.pick!==null&&x.pick!==x.ok).length, sk=L.length-c-w;
  L.forEach(x=>{ if(x.pick!==null) topicUpd(x.q,x.s,x.pick===x.ok); });
  qMarkSeen(L.filter(x=>x.pick!==null).map(x=>x.q));
  const t={id:'t'+Date.now(),ts:Date.now(),date:today(),subj:'Full test',q:L.length,c,w,neg};
  tests.push(t); if(mode==='db'&&tcol) tcol.doc(t.id).set(t).catch(()=>{}); else saveTests();
  const subj={}; L.forEach(x=>{ const k=QNAME(x.s); const o=subj[k]||(subj[k]={c:0,w:0,s:0}); if(x.pick===null) o.s++; else if(x.pick===x.ok) o.c++; else o.w++; });
  mk.res={c,w,sk,neg,score:c-w*neg,secs:Math.round((Date.now()-mk.t0)/1000),subj}; mockDraw(); render();
}
function mockResultHTML(){
  const r=mk.res, n=mk.list.length, pct=r.score/n*100, wrong=mk.list.filter(x=>x.pick!==x.ok);
  return `<div class="mk-top"><span class="mk-t">Result</span><button class="go" id="mk-close">Band karo</button></div><div class="np-body"><div class="hero" style="margin:0 0 12px"><div class="l">Score</div><div class="big">${r.score.toFixed(2)}<small>/ ${n} · ${pct.toFixed(0)}%</small></div><div class="sub2">Sahi ${r.c} · Galat ${r.w} · Chhode ${r.sk} · ${Math.floor(r.secs/60)}m ${r.secs%60}s</div></div><div class="note">Test history me save ho gaya.</div><h2>Subject-wise</h2><section class="card" style="padding:6px 14px">${Object.entries(r.subj).map(([k,o])=>`<div class="wkt"><div class="nm"><b>${k}</b></div><div class="pc" style="width:auto;color:var(--ok)">${o.c} sahi</div><div class="pc" style="width:auto;color:var(--bad)">${o.w} galat</div><div class="pc" style="width:auto">${o.s} skip</div></div>`).join('')}</section>${wrong.length?`<h2>Review <span>${wrong.length} sawal</span></h2>${wrong.map(x=>`<div class="qexp" style="margin-top:8px"><b>${x.q}</b><br>Aapka jawab: ${x.pick===null?'Chhoda':x.pick}<br>Sahi: <b style="color:var(--ok)">${x.ok}</b><br><span style="color:var(--mute)">${x.e}</span></div>`).join('')}`:'<div class="note" style="margin-top:10px">Sab sahi! Shabaash.</div>'}</div>`;
}
function mockClose(){ clearInterval(mkI); const el=document.getElementById('mockp'); if(el) el.remove(); mk=null; }

/* ---------- 5. heatmap ---------- */
function minutesByDay(){
  const m={}; Object.keys(done).forEach(id=>{ const c=BYID[id]; if(c){ const k=dstr(new Date(done[id])); m[k]=(m[k]||0)+c.m; } });
  HIST.forEach(d=>{ const s=d.items.reduce((a,x)=>a+x.sec,0)/60; m[d.date]=(m[d.date]||0)+s; });
  return m;
}
function heatmapHTML(){
  const m=minutesByDay(), td=new Date(); td.setHours(0,0,0,0); const mon=new Date(td); mon.setDate(td.getDate()-((td.getDay()+6)%7)); const W=14, start=new Date(mon); start.setDate(mon.getDate()-(W-1)*7);
  let cells='', tot=0, act=0;
  for(let w=0;w<W;w++) for(let d=0;d<7;d++){ const dt=new Date(start); dt.setDate(start.getDate()+w*7+d); const k=dstr(dt), v=m[k]||0, fut=dt>td;
    const lv=fut?'':v<=0?'':v<60?'l1':v<120?'l2':v<240?'l3':'l4'; if(!fut&&v>0){ tot+=v; act++; }
    cells+=`<i class="${lv}${k===dstr(td)?' t':''}" style="${fut?'opacity:.35':''}" title="${k}: ${Math.round(v)} min"></i>`; }
  return `<h2>Study heatmap <span>pichhle ${W} hafte</span></h2><section class="card" style="padding:14px"><div class="hm" role="img" aria-label="Study heatmap: ${act} din padhai, ${hm(tot)} total">${cells}</div><div class="hmleg">kam <i></i><i class="hm l1" style="background:color-mix(in srgb,var(--ok) 28%,var(--surface2))"></i><i style="background:color-mix(in srgb,var(--ok) 52%,var(--surface2))"></i><i style="background:color-mix(in srgb,var(--ok) 76%,var(--surface2))"></i><i style="background:var(--ok)"></i> zyada</div><div class="note" style="margin:8px 0 0">${act} din padhai · ${hm(tot)} kul (Mon se shuru, har column ek hafta)</div></section>`;
}

let fcS='All', fcD=[], fcCur=null;
function fcKnown(){ return new Set(jget('ct_fc',[])); }

function fcDraw(){

function fcBind(c){
  let x0=0,dx=0,down=false,moved=false;
  c.addEventListener('pointerdown',e=>{ down=true; moved=false; x0=e.clientX; dx=0; c.style.transition='none'; try{ c.setPointerCapture(e.pointerId); }catch(_){} });
  c.addEventListener('pointermove',e=>{ if(!down) return; dx=e.clientX-x0; if(Math.abs(dx)>8) moved=true; c.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`; });
  const up=()=>{ if(!down) return; down=false; c.style.transition='transform .35s cubic-bezier(.34,1.3,.64,1),opacity .3s';
    if(!moved){ c.classList.toggle('f'); c.style.transform=''; return; }
    if(Math.abs(dx)>90) fcAct(dx>0?'know':'again'); else c.style.transform=''; };
  c.addEventListener('pointerup',up); c.addEventListener('pointercancel',up);
}
function fcAct(kind){
  const c=document.getElementById('fcc'); if(!c||!fcD.length) return; const i=fcD[0];
  c.style.transition='transform .3s ease,opacity .3s'; c.style.transform=`translateX(${kind==='know'?520:-520}px) rotate(${kind==='know'?18:-18}deg)`; c.style.opacity='0';
  setTimeout(()=>{ fcD.shift(); if(kind==='know'){ const K=fcKnown(); K.add(QB[i][1]); jset('ct_fc',[...K]); } else fcD.push(i); fcDraw(); },260);
}
function fcClose(){ const el=document.getElementById('fcp'); if(el) el.remove(); fcCur=null; }

/* ---------- study tools card in Tests tab ---------- */
function studyTools(){
  return `<h2>Revise karo</h2><section class="card" style="padding:14px"><div class="note" style="margin:0 0 10px">Flashcards me sawal ka jawab socho, card dabake palto, phir "Yaad hai" ya "Dobara dikhao" chuno. Card ko left/right swipe bhi kar sakte ho.</div><button class="btn" id="fc-open">Flashcards kholo (${QB.length - fcKnown().size > 0 ? QB.length - fcKnown().size : 0} baaki)</button></section>${weakCard()}${mockCard()}`;
}

/* ---------- 8. weekly report ---------- */
function weekStats(){
  const td=sod(Date.now()), from=td-6*DAYMS;
  const ids=Object.keys(done).filter(id=>BYID[id]&&sod(done[id])>=from), mins=ids.reduce((a,id)=>a+BYID[id].m,0);
  const ts=tests.filter(t=>t.ts&&sod(t.ts)>=from), q=ts.reduce((a,t)=>a+(t.q||0),0), c=ts.reduce((a,t)=>a+(t.c||0),0);
  const S=srsGet(); let rv=0; Object.values(S).forEach(o=>(o.ts||[]).forEach(t=>{ if(sod(t)>=from) rv++; }));
  return {n:ids.length,mins,tests:ts.length,acc:q?Math.round(c/q*100):null,rv,streak:streak(today()),weak:weakList().filter(x=>x.acc<0.8).slice(0,3)};
}
function reportCard(){
  const r=weekStats();
  return `<h2>Hafte ki report <span>pichhle 7 din</span></h2><section class="card" style="padding:14px"><div class="rpt"><div><b>${r.n}</b><span>classes</span></div><div><b>${hm(r.mins)}</b><span>padhai</span></div><div><b>${r.streak}</b><span>din streak</span></div><div><b>${r.tests}</b><span>tests</span></div><div><b>${r.acc===null?'-':r.acc+'%'}</b><span>accuracy</span></div><div><b>${r.rv}</b><span>revision</span></div></div>${r.weak.length?`<div class="note" style="margin:0 0 10px"><b>Kamzor:</b> ${r.weak.map(x=>x.n+' ('+Math.round(x.acc*100)+'%)').join(', ')}</div>`:''}<button class="btn qghost" id="rp-share" style="margin:0">Report share / copy</button></section>`;
}
async function reportShare(){
  const r=weekStats(), txt=`NORCET hafte ki report\nClasses: ${r.n}\nPadhai: ${hm(r.mins)}\nStreak: ${r.streak} din\nTests: ${r.tests}${r.acc===null?'':' (accuracy '+r.acc+'%)'}\nRevision: ${r.rv}${r.weak.length?'\nKamzor: '+r.weak.map(x=>x.n).join(', '):''}`;
  try{ if(navigator.share){ await navigator.share({title:'NORCET report',text:txt}); } else { await navigator.clipboard.writeText(txt); showToast('Report copy ho gayi'); } }catch(_){}
}

/* ---------- 7. shortcuts: ?go=today|plan|tests|prog|quiz|doubts|cards|revise ---------- */
function applyGo(){
  let g=null; try{ g=new URLSearchParams(location.search).get('go'); }catch(e){} if(!g) return;
  const setTab=t=>{ tab=t; try{ localStorage.setItem('ct_tab',t); }catch(_){} render(); };
  if(['today','plan','all','tests','prog'].includes(g)) setTab(g);
  else if(g==='quiz'){ setTab('tests'); }
  else if(g==='doubts') subjSheet('All');
  else if(g==='cards') fcOpen();
  else if(g==='revise'){ setTab('today'); revSheet(); }
}

/* ---------- event wiring ---------- */
document.addEventListener('click',e=>{
  const T=e.target, g=s=>T.closest(s);
  if(g('[data-rvopen]')){ revSheet(); return; }
  const rv=g('[data-rv]'); if(rv){ revMark(rv.dataset.rv); return; }
  if(T.id==='qweak'){ qStartWeak(); return; }
  if(T.id==='bk-out'){ bkExport(); return; }
  if(T.id==='bk-in'){ const f=document.getElementById('bk-file'); if(f) f.click(); return; }
  const mn=g('[data-mn]'); if(mn){ mockN=parseInt(mn.dataset.mn); render(); return; }
  if(T.id==='mk-start'){ mockStart(); return; }
  if(T.id==='rp-share'){ reportShare(); return; }
  if(T.id==='fc-open'){ fcOpen(); return; }
  if(T.closest('#fcp')){
    if(g('#fc-close')){ fcClose(); render(); return; }
    const fs=g('[data-fs]'); if(fs){ fcS=fs.dataset.fs; fcBuild(); fcDraw(); return; }
    if(T.id==='fc-know'){ fcAct('know'); return; } if(T.id==='fc-again'){ fcAct('again'); return; }
    if(T.id==='fc-reset'){ jset('ct_fc',[]); fcBuild(); fcDraw(); return; }
    return;
  }
  if(T.closest('#mockp')&&mk){
    if(mk.res){ if(g('#mk-close')){ mockClose(); render(); } return; }
    const q=mk.list[mk.i];
    const mo=g('[data-mo]'); if(mo){ q.pick=q.opts[parseInt(mo.dataset.mo)]; mockDraw(); return; }
    const mg=g('[data-mg]'); if(mg){ mk.i=parseInt(mg.dataset.mg); mk.pal=false; mockDraw(); return; }
    switch(T.id){
      case 'mk-mark': q.mark=!q.mark; mockDraw(); break;
      case 'mk-clr': q.pick=null; mockDraw(); break;
      case 'mk-prev': if(mk.i>0){ mk.i--; mockDraw(); } break;
      case 'mk-next': if(mk.i<mk.list.length-1){ mk.i++; mockDraw(); } break;
      case 'mk-pal': mk.pal=true; mockDraw(); break;
      case 'mk-back': mk.pal=false; mockDraw(); break;
      case 'mk-sub': mk.ask=true; mockDraw(); break;
      case 'mk-no': mk.ask=false; mockDraw(); break;
      case 'mk-yes': mockFinish(); break;
      case 'mk-quit': mk.ask=true; mockDraw(); break;
    }
  }
});
document.addEventListener('change',e=>{ if(e.target.id==='bk-file'){ const f=e.target.files[0]; e.target.value=''; if(f) bkImport(f); } });
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-rvopen]')){ e.preventDefault(); revSheet(); } });
setTimeout(applyGo,900);

document.addEventListener('click',e=>{
  const as=e.target.closest('[data-asub]'); if(as){ allSub=as.dataset.asub; try{ localStorage.setItem('ct_allsub',allSub); }catch(_){} render(); return; }
});

(function(){ const X={};
  document.addEventListener('scroll',e=>{ const t=e.target; if(t&&t.classList&&(t.classList.contains('asub')||t.classList.contains('rail'))) X[t.classList.contains('asub')?'a':'r']=t.scrollLeft; },true);
  new MutationObserver(()=>{ document.querySelectorAll('.tiles.asub:not([data-i]),.tiles.rail:not([data-i])').forEach(el=>{ el.dataset.i='1'; const k=el.classList.contains('asub')?'a':'r';
    if(X[k]==null){ if(k==='a'){ const sel=el.querySelector('[aria-pressed="true"]'); if(sel) el.scrollLeft=Math.max(0,sel.offsetLeft-16); } X[k]=el.scrollLeft; } else el.scrollLeft=X[k]; }); }).observe(document.body,{childList:true,subtree:true});
})();
boot();
</script>
